<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToonReel Admin — Drama Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%238b5cf6'/%3E%3Cpath d='M38 28 L74 50 L38 72 Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-page">

  <header class="nav">
    <a class="logo" href="index.html" aria-label="ToonReel home">
      <span class="mark">▶</span>
      <span class="wordmark">Toon<span class="grad">Reel</span></span>
    </a>
    <span class="admin-tag">Admin</span>
    <span class="api-badge" id="apiBadge">checking…</span>
    <div class="nav-spacer"></div>
    <a class="btn btn-ghost sm-btn" href="index.html" target="_blank">Open site ↗</a>
    <button class="btn btn-primary sm-btn" id="publishBtn">Publish</button>
  </header>

  <main class="admin-main">
    <div class="draft-banner" id="draftBanner" hidden>
      ⚠️ You have unpublished changes. <b>Publish</b> to make them live.
      <button id="discardDraft">Discard draft</button>
    </div>

    <div class="admin-head">
      <h1>Dramas <span id="showCount"></span></h1>
      <button class="btn btn-primary" id="addBtn">＋ Add Drama</button>
    </div>

    <div class="admin-list" id="adminList"></div>
  </main>

  <!-- ============ LOGIN GATE ============ -->
  <div class="modal-back login-back" id="loginBack">
    <div class="modal login">
      <div class="m-icon">🔐</div>
      <h3>ToonReel Admin</h3>
      <p class="m-desc" id="loginMode" style="text-align:center;color:var(--text-faint);font-size:.78rem;margin:-6px 0 16px">checking…</p>
      <input id="loginUser" type="text" placeholder="Username" autocomplete="username" />
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
      <p class="login-error" id="loginError" hidden></p>
      <button class="btn btn-primary" id="loginBtn" style="justify-content:center">Log in</button>
    </div>
  </div>

  <!-- ============ EDITOR MODAL ============ -->
  <div class="modal-back" id="editorBack">
    <div class="modal editor" id="editorModal"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
