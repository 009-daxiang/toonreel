<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Watch — YT688</title>
  <meta name="description" content="Watch AI-animated micro dramas on YT688." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%238b5cf6'/%3E%3Cpath d='M38 28 L74 50 L38 72 Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#8b5cf6" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="watch-page">

  <header class="nav">
    <a class="logo" href="index.html" aria-label="YT688 home">
      <span class="mark">▶</span>
      <span class="wordmark">YT<span class="grad">688</span></span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="index.html#browse" class="active" data-i18n="nav_genres">Browse</a>
    </nav>
    <div class="nav-spacer"></div>
    <a class="getapp-btn" href="download.html" aria-label="Get the app">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span data-i18n="getapp">Get the App</span>
    </a>
    <div class="lang-wrap">
      <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-label="Language">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 2.6 4 5.6 4 9s-1.2 6.4-4 9c-2.8-2.6-4-5.6-4-9s1.2-6.4 4-9z"/></svg>
        <span id="langCode">EN</span>
      </button>
      <div class="lang-menu" id="langMenu"></div>
    </div>
    <div class="avatar" title="Guest">G</div>
  </header>

  <div class="watch-layout">
    <!-- ============ PLAYER COLUMN ============ -->
    <div class="player-col">
      <div class="player" id="player">
        <video id="video" playsinline preload="metadata"></video>
        <div class="tap-zone" id="tapZone"></div>
        <div class="top-grad"></div>
        <div class="bot-grad"></div>
        <div class="center-flash" id="centerFlash">
          <span class="disc" id="disc">
            <svg id="discIcon" width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M8 5l12 7-12 7z"/></svg>
          </span>
        </div>
        <div class="player-hud">
          <div class="top">
            <span class="ep-num" id="hudEpNum"></span>
            <button class="icon-btn fav-btn" id="favBtn" aria-label="Toggle favorite"></button>
          </div>
          <div class="bottom">
            <input class="progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="Seek" />
            <div class="hud-row">
              <button class="icon-btn" id="playBtn" aria-label="Play or pause">
                <svg id="playIcon" width="19" height="19" viewBox="0 0 24 24" fill="#fff"><path d="M8 5l12 7-12 7z"/></svg>
              </button>
              <button class="icon-btn" id="muteBtn" aria-label="Mute or unmute">
                <svg id="muteIcon" width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l6 5V4L8 9H4z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
              </button>
              <span class="time"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></span>
              <span style="flex:1"></span>
              <button class="icon-btn" id="nextBtn" aria-label="Next episode" title="Next episode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M6 5l9 7-9 7V5zm11 0h2.5v14H17z"/></svg>
              </button>
              <button class="icon-btn" id="fsBtn" aria-label="Fullscreen">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="ep-nav-btns">
        <button class="btn btn-ghost" id="prevEp" data-i18n="prev_ep">‹ Prev</button>
        <button class="btn btn-primary" id="nextEp" data-i18n="next_ep">Next ›</button>
      </div>
    </div>

    <!-- ============ INFO COLUMN ============ -->
    <div class="info-col">
      <div class="badge-line" id="badges"></div>
      <h1 id="showTitle"></h1>
      <p class="tagline" id="showTagline"></p>
      <div class="stats" id="showStats"></div>
      <p class="desc" id="showDesc"></p>
      <div class="info-actions">
        <button class="btn btn-ghost" id="infoFav"></button>
        <button class="btn btn-ghost" id="shareBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3m0 0L7 8m5-5 5 5"/></svg>
          <span data-i18n="share">Share</span>
        </button>
      </div>

      <div class="ep-list">
        <h3><span data-i18n="episodes_h">Episodes</span> <span id="epCount" style="color:var(--text-dim);font-size:.85rem;font-weight:600"></span></h3>
        <p class="free-hint" id="freeHint"></p>
        <div class="episodes" id="epList"></div>
      </div>

      <!-- banner ad slot (fills when an ad provider is configured) -->
      <div id="adSlotWatch" style="margin-top:26px"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/watch.js"></script>
</body>
</html>
